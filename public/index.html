  <!-- Inline override to neutralize glass-panel borders/shadows in playground -->
  <style>
    /* Strip borders and shadows from chat message bubbles */
    #chat-messages-container .glass-panel,
    #chat-messages-container > div > .glass-panel {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
    }
    /* Starter cards keep subtle border for interaction hint */
    #chat-messages-container > div > .glass-panel[onclick] {
      background: rgba(255,255,255,0.03) !important;
      border: 1px solid var(--border-color) !important;
      box-shadow: none !important;
    }

    /* ── Antigravity Chat UI Styles ── */

    /* Thinking Trace Block */
    .agv-think-block { margin: 8px 0; border: 1px solid #a855f7; background: rgba(168,85,247,0.06); border-radius: 8px; overflow: hidden; }
    .agv-think-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; cursor: pointer; background: rgba(168,85,247,0.08); user-select: none; }
    .agv-think-header span { font-size: 0.76rem; font-weight: 700; color: #a855f7; }
    .agv-think-icon { margin-right: 6px; }
    .agv-think-chevron { font-size: 0.65rem; color: var(--text-muted); transition: transform 0.2s; }
    .agv-think-body { padding: 8px 12px; font-size: 0.74rem; color: var(--text-muted); line-height: 1.5; white-space: pre-wrap; border-top: 1px solid rgba(168,85,247,0.15); max-height: 300px; overflow-y: auto; }

    /* Code Blocks */
    .agv-code-block { margin: 8px 0; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: rgba(0,0,0,0.3); }
    .agv-code-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border-color); }
    .agv-code-lang { font-size: 0.68rem; font-weight: 700; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.5px; }
    .agv-code-actions { display: flex; gap: 4px; }
    .agv-code-btn { padding: 2px 8px; font-size: 0.65rem; border-radius: 4px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.05); color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
    .agv-code-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .agv-artifact-btn { border-color: var(--accent-emerald); color: var(--accent-emerald); }
    .agv-artifact-btn:hover { background: var(--accent-emerald); color: #fff; }
    .agv-code-pre { margin: 0; padding: 12px; font-size: 0.76rem; line-height: 1.5; overflow-x: auto; color: var(--text-main); }
    .agv-code-pre code { font-family: 'Fira Code', monospace; }

    /* Diff Blocks */
    .agv-diff-block { border-color: rgba(99,102,241,0.3); }
    .agv-diff-pre { font-family: 'Fira Code', monospace; }
    .agv-diff-add { color: #10b981; background: rgba(16,185,129,0.08); display: block; }
    .agv-diff-del { color: #f43f5e; background: rgba(244,63,94,0.08); display: block; }
    .agv-diff-ctx { color: var(--text-muted); display: block; }

    /* Mermaid Diagrams */
    .agv-mermaid-block { margin: 8px 0; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .agv-mermaid-render { padding: 16px; background: rgba(0,0,0,0.2); min-height: 80px; display: flex; align-items: center; justify-content: center; }
    .agv-mermaid-render svg { max-width: 100%; }

    /* GitHub-Style Alerts */
    .agv-alert { margin: 8px 0; padding: 10px 14px; border-radius: 6px; border-left: 4px solid; }
    .agv-alert-title { font-size: 0.76rem; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .agv-alert-body { font-size: 0.78rem; color: var(--text-main); line-height: 1.5; }

    /* Tables */
    .agv-table-wrap { margin: 8px 0; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
    .agv-table-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border-color); }
    .agv-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .agv-th { padding: 8px 12px; background: rgba(99,102,241,0.1); color: var(--primary-light); font-weight: 700; text-align: left; border-bottom: 2px solid var(--primary); }
    .agv-td { padding: 6px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
    .agv-table tbody tr:hover { background: rgba(99,102,241,0.05); }

    /* Markdown Inline */
    .agv-inline-code { padding: 2px 6px; border-radius: 4px; background: rgba(99,102,241,0.12); color: var(--primary-light); font-family: 'Fira Code', monospace; font-size: 0.82em; }
    .agv-link { color: var(--accent-cyan); text-decoration: underline; text-underline-offset: 2px; }
    .agv-link:hover { color: var(--primary-light); }
    .agv-img { max-width: 100%; border-radius: 8px; margin: 6px 0; border: 1px solid var(--border-color); }
    .agv-h1 { font-size: 1.4rem; font-weight: 700; color: var(--text-main); margin: 16px 0 8px; }
    .agv-h2 { font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin: 14px 0 6px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
    .agv-h3 { font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin: 12px 0 4px; }
    .agv-h4, .agv-h5, .agv-h6 { font-size: 0.92rem; font-weight: 700; color: var(--text-muted); margin: 10px 0 4px; }
    .agv-hr { border: none; border-top: 1px solid var(--border-color); margin: 12px 0; }
    .agv-blockquote { border-left: 3px solid var(--primary); padding: 4px 12px; margin: 8px 0; color: var(--text-muted); background: rgba(99,102,241,0.05); border-radius: 0 4px 4px 0; }
    .agv-ul, .agv-ol { padding-left: 20px; margin: 6px 0; }
    .agv-li, .agv-oli { padding: 2px 0; color: var(--text-main); font-size: 0.85rem; line-height: 1.5; }

    /* Tool Progress Panel */
    .agv-tool-progress { position: sticky; bottom: 0; left: 0; right: 0; display: none; flex-direction: column; gap: 4px; padding: 8px 12px; background: var(--bg-card); border-top: 1px solid var(--accent-cyan); border-radius: 8px 8px 0 0; z-index: 50; animation: agvSlideUp 0.3s ease; }
    .agv-tool-entry { display: flex; align-items: center; gap: 8px; font-size: 0.74rem; padding: 4px 8px; border-radius: 4px; color: var(--text-main); background: rgba(0,0,0,0.2); }
    .agv-tool-active { border-left: 3px solid var(--accent-cyan); }
    .agv-tool-done { border-left: 3px solid var(--accent-emerald); opacity: 0.7; }

    @keyframes agvSlideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
